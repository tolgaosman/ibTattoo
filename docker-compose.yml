services:
  web:
    image: nginx:alpine
    ports:
      - "4002:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - backend-storage:/var/www/backend/storage/app/public
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: ghcr.io/tolgaosman/ibtattoo-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the standalone build (next.config.ts rewrites). Must match
        # the runtime value below — see the comment in frontend/Dockerfile.
        API_URL: http://web/api
    environment:
      - NODE_ENV=production
      - API_URL=http://web/api
    restart: unless-stopped

  backend:
    image: ghcr.io/tolgaosman/ibtattoo-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend-storage:/var/www/html/storage/app/public
      - ./frontend:/var/www/frontend:ro
    environment:
      - APP_ENV=production
      # Without these the container falls back to .env.example, which carries
      # APP_DEBUG=true and APP_URL=http://127.0.0.1:8000 — the latter is what
      # leaked absolute localhost URLs into stored image paths.
      - APP_DEBUG=false
      - APP_URL=https://tatt2me.net
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ibtattoo
      - DB_USERNAME=ibtattoo_user
      - DB_PASSWORD=ibtattoo_pass
      - ADMIN_EMAIL=irmakyamuer2000@gmail.com
      - ADMIN_PASSWORD=irmak2005tatt2me
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=ibtattoo
      - MYSQL_USER=ibtattoo_user
      - MYSQL_PASSWORD=ibtattoo_pass
      - MYSQL_ROOT_PASSWORD=root_pass
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  backend-storage:
  db-data:
