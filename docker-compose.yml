services:
  web:
    image: nginx:alpine
    ports:
      - "4002:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - backend-storage:/var/www/backend/storage/app/public
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:9000/api
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend-storage:/var/www/html/storage/app/public
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ibtattoo
      - DB_USERNAME=ibtattoo_user
      - DB_PASSWORD=ibtattoo_pass
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=ibtattoo
      - MYSQL_USER=ibtattoo_user
      - MYSQL_PASSWORD=ibtattoo_pass
      - MYSQL_ROOT_PASSWORD=root_pass
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  backend-storage:
  db-data:
